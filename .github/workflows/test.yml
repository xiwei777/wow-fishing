name: Source tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84
      - run: python -m unittest discover -s tests -v
